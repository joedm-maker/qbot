AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: QBIM Slack Bot — score tracker for lunchtime Quiddler

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Architectures:
      - x86_64
    Environment:
      Variables:
        GAMES_TABLE: !Ref GamesTable
        SCORES_TABLE: !Ref ScoresTable
        PLAYERS_TABLE: !Ref PlayersTable
        SLACK_BOT_TOKEN: !Ref SlackBotToken
        SLACK_SIGNING_SECRET: !Ref SlackSigningSecret
        SLACK_CHANNEL_ID: !Ref SlackChannelId
        SLACK_ADMIN_USER_ID: !Ref SlackAdminUserId
        AUTOQ_TABLE: !Ref AutoQTable
        DICTIONARY_TABLE: !Ref DictionaryTable
        VOTES_TABLE: !Ref VotesTable
        MW_API_KEY: !Ref MerriamWebsterApiKey

Parameters:
  SlackBotToken:
    Type: String
    NoEcho: true
    Description: Slack Bot User OAuth Token (xoxb-...)
  SlackSigningSecret:
    Type: String
    NoEcho: true
    Description: Slack app Signing Secret
  SlackChannelId:
    Type: String
    Description: Channel ID for #qbim
  SlackAdminUserId:
    Type: String
    Default: U09MS4ZGBHN
    Description: Slack user ID for the bot admin
  MerriamWebsterApiKey:
    Type: String
    NoEcho: true
    Description: Merriam-Webster Collegiate Dictionary API key

Resources:
  # ---------- EventBridge Scheduler Role ----------
  QuicklerTimerSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: qbim-quickler-scheduler-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeTimerLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt QuicklerTimerFunction.Arn

  VoteTimerSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: qbim-vote-scheduler-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeVoteTimerLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt VoteTimerFunction.Arn

  # ---------- API Gateway ----------
  QbimApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: qbim-api
      StageName: prod

  # ---------- Lambda Function (single router) ----------
  QbimBotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: qbim-bot
      Handler: src/handlers/router.handler
      CodeUri: .
      Environment:
        Variables:
          QUICKLER_TIMER_FUNCTION_ARN: !GetAtt QuicklerTimerFunction.Arn
          QUICKLER_TIMER_ROLE_ARN: !GetAtt QuicklerTimerSchedulerRole.Arn
          VOTE_TIMER_FUNCTION_ARN: !GetAtt VoteTimerFunction.Arn
          VOTE_TIMER_ROLE_ARN: !GetAtt VoteTimerSchedulerRole.Arn
          SCORE_WORKER_FUNCTION_NAME: !Ref ScoreWorkerFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GamesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ScoresTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlayersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AutoQTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DictionaryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref VotesTable
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:DeleteSchedule
              Resource:
                - !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/qbim-timer-*"
                - !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/qbim-vote-*"
        - Statement:
            - Effect: Allow
              Action: iam:PassRole
              Resource:
                - !GetAtt QuicklerTimerSchedulerRole.Arn
                - !GetAtt VoteTimerSchedulerRole.Arn
        - LambdaInvokePolicy:
            FunctionName: !Ref ScoreWorkerFunction
      Events:
        SlackEvents:
          Type: Api
          Properties:
            RestApiId: !Ref QbimApi
            Path: /slack/events
            Method: POST
        SlackInteractivity:
          Type: Api
          Properties:
            RestApiId: !Ref QbimApi
            Path: /slack/interactivity
            Method: POST
        StatsPlayers:
          Type: Api
          Properties:
            RestApiId: !Ref QbimApi
            Path: /stats/players
            Method: GET
        StatsGames:
          Type: Api
          Properties:
            RestApiId: !Ref QbimApi
            Path: /stats/games
            Method: GET
        StatsScores:
          Type: Api
          Properties:
            RestApiId: !Ref QbimApi
            Path: /stats/scores
            Method: GET
        StatsLive:
          Type: Api
          Properties:
            RestApiId: !Ref QbimApi
            Path: /stats/live
            Method: GET

  # ---------- Quickler Timer Lambda ----------
  QuicklerTimerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: qbim-quickler-timer
      Handler: src/handlers/quickler-timer.handler
      CodeUri: .
      Timeout: 15
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GamesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ScoresTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlayersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AutoQTable

  # ---------- Vote Timer Lambda ----------
  VoteTimerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: qbim-vote-timer
      Handler: src/handlers/vote-timer.handler
      CodeUri: .
      Timeout: 15
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GamesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ScoresTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlayersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DictionaryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref VotesTable

  # ---------- Score Worker Lambda (async save / validation) ----------
  ScoreWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: qbim-score-worker
      Handler: src/handlers/score-worker.handler
      CodeUri: .
      Timeout: 15
      Environment:
        Variables:
          QUICKLER_TIMER_FUNCTION_ARN: !GetAtt QuicklerTimerFunction.Arn
          QUICKLER_TIMER_ROLE_ARN: !GetAtt QuicklerTimerSchedulerRole.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GamesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ScoresTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlayersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DictionaryTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AutoQTable
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:DeleteSchedule
              Resource: !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/qbim-timer-*"
        - Statement:
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt QuicklerTimerSchedulerRole.Arn

  # ---------- DynamoDB Tables ----------
  GamesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: qbim-games
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: game_id
          AttributeType: S
        - AttributeName: game_date
          AttributeType: S
        - AttributeName: game_number
          AttributeType: N
      KeySchema:
        - AttributeName: game_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: date-index
          KeySchema:
            - AttributeName: game_date
              KeyType: HASH
            - AttributeName: game_number
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ScoresTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: qbim-scores
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: game_id
          AttributeType: S
        - AttributeName: player_hand_key
          AttributeType: S
      KeySchema:
        - AttributeName: game_id
          KeyType: HASH
        - AttributeName: player_hand_key
          KeyType: RANGE

  PlayersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: qbim-players
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slack_id
          AttributeType: S
      KeySchema:
        - AttributeName: slack_id
          KeyType: HASH

  AutoQTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: qbim-autoq
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: player_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: player-index
          KeySchema:
            - AttributeName: player_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  DictionaryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: qbim-dictionary
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: word
          AttributeType: S
      KeySchema:
        - AttributeName: word
          KeyType: HASH

  VotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: qbim-votes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: vote_id
          AttributeType: S
      KeySchema:
        - AttributeName: vote_id
          KeyType: HASH

Outputs:
  ApiUrl:
    Description: API Gateway URL for Slack app configuration
    Value: !Sub "https://${QbimApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
